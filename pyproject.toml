[project]
name = "x-scraper"
version = "0.1.0"
description = "Async X/Twitter scraper without the official API, with a local sub-1B model for on-device filtering/summarization."
requires-python = ">=3.10"
dependencies = [
    "httpx[http2]>=0.27",
]

[project.optional-dependencies]
local-model = ["llama-cpp-python>=0.2.90"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
x-scraper = "x_scraper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
